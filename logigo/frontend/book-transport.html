<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Transport | LogiGo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="logo">🚚 LogiGo</div>
  <nav>
    <a href="customer-dashboard.html">Dashboard</a>
    <a href="book-transport.html">Book Transport</a>
    <a href="my-bookings.html">My Bookings</a>
    <a href="#" id="logoutLink">Logout</a>
  </nav>
</div>

<div class="container" style="max-width: 640px;">
  <div class="card">
    <h2>Book a Transport</h2>

    <form id="bookingForm" class="mt-24">
      <div class="grid grid-2">
        <div class="form-group">
          <label>Pickup Location</label>
          <input type="text" id="pickup_location" placeholder="e.g. Kothrud, Pune" required>
        </div>
        <div class="form-group">
          <label>Delivery Location</label>
          <input type="text" id="delivery_location" placeholder="e.g. Hinjewadi, Pune" required>
        </div>
      </div>

      <div class="form-group">
        <label>Approx. Distance (km)</label>
        <input type="number" id="distance_km" min="1" step="0.1" required>
      </div>

      <div class="form-group">
        <label>Vehicle Type</label>
        <select id="vehicle_type" required>
          <option value="mini_truck">Mini Truck</option>
          <option value="pickup_van">Pickup Van</option>
          <option value="large_truck">Large Truck</option>
        </select>
      </div>

      <div class="form-group">
        <label>Goods Description</label>
        <input type="text" id="goods_description" placeholder="e.g. Household furniture" required>
      </div>

      <div class="form-group">
        <label>Goods Weight (kg)</label>
        <input type="number" id="goods_weight_kg" min="1" step="0.1" required>
      </div>

      <button type="button" id="estimateBtn" class="btn btn-outline btn-block">Get Estimated Price</button>

      <div id="estimateResult" class="mt-16" style="display:none;">
        <div class="card stat-card">
          <div class="value" id="estimatedPrice">₹0</div>
          <div class="label">Estimated Price</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-16">Confirm Booking</button>
      <p id="errorMsg" class="error-text"></p>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
