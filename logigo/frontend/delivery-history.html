<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery History | LogiGo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="driver-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">🚚 LogiGo <span class="muted" style="font-size:12px;">Driver</span></div>
    <nav class="sidebar-nav">
      <a href="driver-dashboard.html">📊 Dashboard</a>
      <a href="driver-deliveries.html">📦 My Deliveries</a>
      <a href="delivery-history.html" class="active">🕘 Delivery History</a>
      <a href="driver-earnings.html">💰 Earnings</a>
      <a href="driver-profile.html">👤 My Profile</a>
      <a href="driver-notifications.html">🔔 Notifications</a>
      <a href="driver-settings.html">⚙️ Settings</a>
      <a href="#" id="logoutLink">🚪 Logout</a>
    </nav>
  </aside>

  <main class="main-content">
    <div class="top-header">
      <button class="hamburger" id="hamburgerBtn">☰</button>
      <h2>Delivery History</h2>
    </div>

    <div class="card mt-24">
      <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
        <input type="text" id="searchInput" placeholder="Search by customer, pickup, destination or ID" style="flex:1; min-width:220px; padding:8px 12px; border:1px solid var(--border); border-radius:6px;">
        <select id="statusFilter" style="padding:8px 12px; border:1px solid var(--border); border-radius:6px;">
          <option value="all">All</option>
          <option value="pending">Pending</option>
          <option value="assigned">Assigned</option>
          <option value="accepted">Accepted</option>
          <option value="picked_up">Picked Up</option>
          <option value="in_transit">In Transit</option>
          <option value="delivered">Completed</option>
          <option value="cancelled">Cancelled</option>
          <option value="rejected">Rejected</option>
        </select>
        <button class="btn btn-outline btn-sm" onclick="resetDriverFilters()">Reset</button>
      </div>
    </div>

    <div id="historyList" class="mt-24"></div>
  </main>
</div>

<script src="js/api.js"></script>
<script src="js/delivery-history.js"></script>
<script>
  document.getElementById('hamburgerBtn').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
</script>
</body>
</html>
