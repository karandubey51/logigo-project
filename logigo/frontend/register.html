<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | LogiGo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="logo">🚚 LogiGo</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
  </nav>
</div>

<div class="container" style="max-width: 480px;">
  <div class="card">
    <h2 class="text-center">Create Account</h2>

    <form id="registerForm" class="mt-24">
      <div class="form-group">
        <label>Register as</label>
        <select id="role" required>
          <option value="customer">Customer</option>
          <option value="driver">Driver</option>
        </select>
      </div>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" required minlength="6">
      </div>
      <div class="form-group">
        <label>Phone</label>
        <input type="tel" id="phone">
      </div>

      <div id="customerFields">
        <div class="form-group">
          <label>Address</label>
          <input type="text" id="address">
        </div>
      </div>

      <div id="driverFields" style="display:none;">
        <div class="form-group">
          <label>License Number</label>
          <input type="text" id="license_number">
        </div>
        <div class="form-group">
          <label>Vehicle Type</label>
          <select id="vehicle_type">
            <option value="mini_truck">Mini Truck</option>
            <option value="pickup_van">Pickup Van</option>
            <option value="large_truck">Large Truck</option>
          </select>
        </div>
        <div class="form-group">
          <label>Vehicle Number</label>
          <input type="text" id="vehicle_number">
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Register</button>
      <p id="errorMsg" class="error-text"></p>
    </form>

    <p class="text-center mt-16 muted">
      Already have an account? <a href="login.html">Login here</a>
    </p>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
